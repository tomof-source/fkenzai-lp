# 玄関見積LPを会社サーバー（https://f-kenzai.com/genkan-mitsumori/）へ送る。
# genkan-mitsumori/ を直して main に入れると自動で動く。Actions 画面の「Run workflow」からも動かせる（main のときだけ送る）。
# 流れ：組み立て → ブラウザで確認（落ちたら送らない）→ サーバーの今の版を控える → 画像 → index.html の順に送る
#       → 公開URLで index.html と全画像を確認 → 落ちたらその回の控えから自動で戻し、戻ったかも確かめる
# 接続先（ホスト・ユーザー・置き場所・指紋）も Secrets に置く。公開リポジトリの実行ログでは *** に伏せられる
# 設定・止め方・戻し方は tools/company-deploy/README.md
name: 玄関見積LPを会社サーバーへ反映

on:
  push:
    branches: [main]
    paths:
      - 'genkan-mitsumori/**'
      - 'tools/company-deploy/**'
      - '.github/workflows/deploy-genkan-company.yml'
  workflow_dispatch:

concurrency:
  group: deploy-genkan-company
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # 試作ブランチから本番へ送れないようにする
    if: github.ref == 'refs/heads/main'
    # ubuntu-latest は 2026-10-19 から Ubuntu 26 になり、playwright 1.56.1 が chromium を入れられない（2026-10-26 送信前の確認で停止）
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SSH_HOST: ${{ secrets.XSERVER_HOST }}
      SSH_USER: ${{ secrets.XSERVER_USER }}
      SSH_PORT: '10022'
      REMOTE_DIR: ${{ secrets.XSERVER_GENKAN_DIR }}
      PUBLIC_URL: https://f-kenzai.com/genkan-mitsumori/
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: 組み立て（data.json を index.html に埋め込み、画像に指紋を付ける）
        run: python3 tools/company-deploy/build_genkan.py genkan-mitsumori dist/genkan-mitsumori

      - name: 送る前にブラウザで確認
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
          node tools/company-deploy/check_built.mjs dist/genkan-mitsumori

      - name: サーバーの設定がそろっているか
        id: ready
        env:
          SSH_KEY: ${{ secrets.XSERVER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.XSERVER_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$REMOTE_DIR" ] || [ -z "$SSH_KEY" ] || [ -z "$KNOWN_HOSTS" ]; then
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              echo "::warning::サーバーの設定が未登録なので、組み立てと確認だけで終わります（送信はしていません）"
              echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "::error::サーバーの設定（鍵・接続先・置き場所・指紋）のどれかが空です。送信していません"
            exit 1
          fi
          # 置き場所を間違えてサイトの入口（public_html 直下）を上書きしないよう、形を限る
          if ! printf '%s' "$REMOTE_DIR" | grep -Eq '^/home/[^/]+/[^/]+/public_html/genkan-mitsumori$'; then
            echo "::error::XSERVER_GENKAN_DIR が …/public_html/genkan-mitsumori の形ではありません。送信していません"
            exit 1
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"

      - name: SSH の準備
        if: steps.ready.outputs.go == 'true'
        env:
          SSH_KEY: ${{ secrets.XSERVER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.XSERVER_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          # 相手のサーバーが本物かは、登録しておいた指紋で確かめる（毎回取り直さない）
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
          echo "SSH_CMD=ssh -p $SSH_PORT -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4" >> "$GITHUB_ENV"

      - name: サーバーの今の版を控える
        id: backup
        if: steps.ready.outputs.go == 'true'
        run: |
          name=$($SSH_CMD "$SSH_USER@$SSH_HOST" bash -s -- "$REMOTE_DIR" <<'EOS'
          set -eu
          dir="$1"
          # フォルダが無いなら置き場所の設定が違う。作らずに止める
          [ -d "$dir" ] || { echo "置き場所のフォルダがありません" >&2; exit 1; }
          mkdir -p "$HOME/lp_backup"
          # TASARTさんが最初に置いた版は genkan-mitsumori_original.tgz として消さずに残す
          if [ -f "$HOME/lp_backup/genkan-mitsumori_original.tgz" ]; then
            name="genkan-mitsumori_$(date +%Y%m%d-%H%M%S).tgz"
          else
            name="genkan-mitsumori_original.tgz"
          fi
          tar czf "$HOME/lp_backup/$name" -C "$(dirname "$dir")" "$(basename "$dir")"
          # 日付つきの控えは直近10回分だけ残す
          ls -1t "$HOME"/lp_backup/genkan-mitsumori_2*.tgz 2>/dev/null | tail -n +11 | xargs -r rm --
          echo "$name"
          EOS
          )
          echo "控え: ~/lp_backup/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: 送る（画像を先に、index.html を最後に）
        id: send
        if: steps.ready.outputs.go == 'true'
        run: |
          $SSH_CMD "$SSH_USER@$SSH_HOST" "mkdir -p '$REMOTE_DIR/img'"
          rsync -rlptz --checksum --chmod=D755,F644 -e "$SSH_CMD" dist/genkan-mitsumori/img/ "$SSH_USER@$SSH_HOST:$REMOTE_DIR/img/"
          rsync -lptz --chmod=F644 -e "$SSH_CMD" dist/genkan-mitsumori/index.html "$SSH_USER@$SSH_HOST:$REMOTE_DIR/index.html"

      - name: 公開URLで確認（index.html と全画像）
        if: steps.ready.outputs.go == 'true'
        run: python3 tools/company-deploy/verify_public.py dist/genkan-mitsumori/index.html "$PUBLIC_URL"

      - name: 失敗したので、この回の控えから戻す
        # 時間切れ（cancelled）で止まったときも戻す
        if: (failure() || cancelled()) && steps.send.outcome != 'skipped' && steps.backup.outputs.name != ''
        run: |
          $SSH_CMD "$SSH_USER@$SSH_HOST" bash -s -- "$REMOTE_DIR" "${{ steps.backup.outputs.name }}" <<'EOS'
          set -eu
          dir="$1"; name="$2"
          tar xzf "$HOME/lp_backup/$name" -C "$(dirname "$dir")"
          EOS
          # 戻したあと、公開ページが控えの index.html と同じになったかを確かめる
          want=$($SSH_CMD "$SSH_USER@$SSH_HOST" "tar -xzOf \"\$HOME/lp_backup/${{ steps.backup.outputs.name }}\" genkan-mitsumori/index.html" | sha256sum | cut -d' ' -f1)
          for i in 1 2 3 4 5 6; do
            got=$(curl -fsS -H 'Cache-Control: no-cache' "${PUBLIC_URL}?rollback=${GITHUB_RUN_ID}-${i}" | sha256sum | cut -d' ' -f1 || true)
            if [ "$got" = "$want" ]; then
              echo "::error::公開ページを送る前の版（~/lp_backup/${{ steps.backup.outputs.name }}）に戻しました（公開URLで一致を確認）。原因を直してから main に入れ直してください"
              exit 1
            fi
            sleep 10
          done
          echo "::error::送る前の版に戻そうとしましたが、公開ページが控えと一致しません。公開ページを開いて表示を確かめ、README の「サーバーから直接戻すとき」の手順か、TASARTさんへの連絡で対応してください"
          exit 1
